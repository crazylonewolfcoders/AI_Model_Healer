server:
  port: 8080

spring:
  application:
    name: simple-web-app
  data:
    redis:
      host: localhost
      port: 6379
  jackson:
    serialization:
      indent_output: true
  datasource:
    url: jdbc:postgresql://localhost:5432/omnij_sampleapp
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver


logging:
  file:
    name: logs/sampleapp.log
  level:
    org.springframework.boot.autoconfigure.condition: DEBUG
    root: INFO
    io.github.crazy.lonewolf: DEBUG

omnij:
  engine:
    enableAutoHealing: true
  jsonvalidations:
    enableMandatoryChecks: true
  memoryContainer:
    useCustomContainer : true

  datasource:
    url: jdbc:postgresql://localhost:5432/omnij_sampleapp
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver





